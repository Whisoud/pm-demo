<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>原型交付预览</title>
  <script src="./framework/assets/vendor/tailwind.js"></script>
  <script src="./framework/assets/vendor/lucide.min.js"></script>
  <script src="./framework/assets/vendor/marked.min.js"></script>
  <script src="./framework/assets/vendor/purify.min.js"></script>
  <link rel="stylesheet" href="./framework/assets/styles/main.css">
</head>
<body class="bg-slate-50 text-slate-900 font-sans antialiased h-screen flex flex-col overflow-hidden">

  <!-- 顶部导航栏 -->
  <header class="bg-white border-b border-slate-200 h-14 flex items-center px-4 shrink-0 z-30 relative">
    <div class="flex items-center gap-3 absolute left-4">
      <button id="toggle-sidebar-btn" class="p-1.5 text-slate-500 hover:text-slate-800 hover:bg-slate-100 rounded-md transition-colors" title="切换侧边栏">
        <i data-lucide="panel-left" class="w-5 h-5"></i>
      </button>
      <h1 class="font-semibold text-lg tracking-tight" id="project-title-display"></h1>
      <span class="bg-slate-100 text-slate-600 text-xs font-medium px-2 py-0.5 rounded-full border border-slate-200" id="project-version-display"></span>
    </div>
    <div class="flex items-center gap-2 absolute right-4">
      <button id="global-req-btn" class="flex items-center gap-2 text-sm text-slate-600 hover:text-blue-600 font-medium px-3 py-1.5 rounded-md hover:bg-blue-50 transition-colors">
        <i data-lucide="book-open" class="w-4 h-4"></i>
        全局说明
      </button>
      <button id="toggle-prd-btn" class="p-1.5 text-slate-500 hover:text-slate-800 hover:bg-slate-100 rounded-md transition-colors ml-2" title="切换需求说明">
        <i data-lucide="panel-right" class="w-5 h-5"></i>
      </button>
    </div>
  </header>

  <div class="flex flex-1 overflow-hidden relative">
    <!-- 左侧目录树 -->
    <aside id="sidebar" class="w-80 bg-white border-r border-slate-200 flex flex-col shrink-0 transition-all duration-300 relative z-20">
      <div class="p-3 border-b border-slate-100">
        <div class="relative" id="search-container">
          <i data-lucide="search" class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
          <input type="text" placeholder="搜索页面..." class="w-full pl-9 pr-3 py-1.5 bg-slate-100 border-transparent rounded-md text-sm focus:bg-white focus:border-blue-500 focus:ring-2 focus:ring-blue-200 transition-all outline-none">
        </div>
      </div>
      <div class="flex-1 overflow-y-auto p-2" id="nav-tree"></div>
    </aside>

    <!-- 中间主内容区 -->
    <main class="flex-1 relative bg-slate-100 flex flex-col">
      <div class="h-12 bg-white border-b border-slate-200 flex items-center justify-between px-4 shrink-0 relative">
        <div class="flex items-center gap-2 min-w-0 max-w-[48%]">
          <div class="text-sm font-medium text-slate-700 truncate" id="current-page-title"></div>
        </div>

        <div class="absolute left-1/2 -translate-x-1/2 flex items-center bg-slate-100 p-0.5 rounded-lg border border-slate-200 text-xs shadow-xs" id="viewport-switcher">
          <button class="viewport-btn active px-2.5 py-1 rounded-md text-slate-700 bg-white shadow-xs font-medium flex items-center gap-1.5 transition-all" data-viewport="desktop" title="自适应宽度 (PC 桌面)">
            <i data-lucide="monitor" class="w-3.5 h-3.5"></i><span class="hidden sm:inline">桌面</span>
          </button>
          <button class="viewport-btn px-2.5 py-1 rounded-md text-slate-500 hover:text-slate-700 font-medium flex items-center gap-1.5 transition-all" data-viewport="tablet" title="平板模式 (768px)">
            <i data-lucide="tablet" class="w-3.5 h-3.5"></i><span class="hidden sm:inline">平板</span>
          </button>
          <button class="viewport-btn px-2.5 py-1 rounded-md text-slate-500 hover:text-slate-700 font-medium flex items-center gap-1.5 transition-all" data-viewport="mobile" title="手机模式 (375px)">
            <i data-lucide="smartphone" class="w-3.5 h-3.5"></i><span class="hidden sm:inline">手机</span>
          </button>
          <div class="h-3.5 w-px bg-slate-200 mx-1"></div>
          <div class="flex items-center gap-0.5 pl-0.5" id="zoom-controls">
            <button id="zoom-out-btn" class="p-1 rounded text-slate-500 hover:text-slate-800 hover:bg-slate-200/60 transition-colors" title="缩小视口"><i data-lucide="minus" class="w-3 h-3"></i></button>
            <button id="zoom-value-btn" class="px-1.5 py-0.5 rounded text-[11px] font-mono font-medium text-slate-600 hover:text-blue-600 hover:bg-blue-50 transition-colors" title="点击在 自适应(Fit) 与 100% 之间切换">100%</button>
            <button id="zoom-in-btn" class="p-1 rounded text-slate-500 hover:text-slate-800 hover:bg-slate-200/60 transition-colors" title="放大视口"><i data-lucide="plus" class="w-3 h-3"></i></button>
          </div>
        </div>

        <div class="flex items-center gap-2">
          <button id="toggle-annotation-btn" class="flex items-center gap-1.5 text-sm text-blue-600 font-medium px-3 py-1 bg-blue-50 rounded-md hover:bg-slate-200 transition-colors">
            <i data-lucide="message-square-dashed" class="w-4 h-4"></i><span>隐藏标注</span>
          </button>
        </div>
      </div>

      <div class="flex-1 relative overflow-auto p-6 flex justify-center items-start" id="canvas-wrapper">
        <div class="bg-white w-full h-full rounded-lg shadow-sm border border-slate-200 relative overflow-hidden flex flex-col transition-all duration-200" id="prototype-container">
          <div id="mobile-statusbar" class="absolute top-2 left-6 right-6 h-5 flex items-center justify-between text-[11px] font-semibold text-slate-900/80 z-30 pointer-events-none hidden font-mono select-none">
            <span>09:41</span>
            <div class="flex items-center gap-1.5"><i data-lucide="wifi" class="w-3 h-3"></i><i data-lucide="battery-medium" class="w-3.5 h-3.5"></i></div>
          </div>
          <div id="mobile-notch" class="absolute top-2.5 left-1/2 -translate-x-1/2 h-5 w-24 bg-black rounded-full flex items-center justify-between px-2.5 z-30 pointer-events-none hidden shadow-xs">
            <span class="w-2.5 h-2.5 rounded-full bg-slate-900 border border-slate-800/80"></span>
            <span class="w-2 h-2 rounded-full bg-slate-900/90"></span>
          </div>
          <div id="mobile-homebar" class="absolute bottom-2 left-1/2 -translate-x-1/2 w-32 h-1 bg-slate-400/60 rounded-full z-30 pointer-events-none hidden"></div>

          <div id="empty-state" class="absolute inset-0 flex flex-col items-center justify-center bg-slate-50 text-slate-400 z-10">
            <i data-lucide="layout-template" class="w-16 h-16 mb-4 opacity-50"></i>
            <p class="text-sm font-medium">当前项目为空</p>
            <p class="text-xs mt-1">暂无已交付页面</p>
          </div>

          <iframe id="prototype-frame" src="about:blank" class="flex-1 w-full border-0 bg-white relative z-20 hidden" allow="clipboard-write"></iframe>
        </div>
      </div>
    </main>

    <!-- 右侧需求面板 -->
    <aside class="w-80 bg-white border-l border-slate-200 flex flex-col shrink-0 shadow-[-4px_0_15px_-3px_rgba(0,0,0,0.05)] z-10 transition-all duration-300 relative" id="prd-panel">
      <div class="h-12 border-b border-slate-200 flex items-center justify-between px-4 shrink-0 bg-slate-50 w-80 whitespace-nowrap">
        <h2 class="font-semibold text-sm text-slate-800 flex items-center gap-2">
          <i data-lucide="file-text" class="w-4 h-4 text-blue-600"></i>需求与交互说明
        </h2>
      </div>
      <div class="flex-1 overflow-y-auto p-4 w-80" id="prd-scroll-container">
        <div id="page-rules-container" class="space-y-2.5 hidden" hidden></div>
        <div id="interactive-annotations-section" class="space-y-3">
          <div class="flex items-center justify-between pb-1.5 border-b border-slate-100" id="walkthrough-bar">
            <span class="text-xs font-semibold text-slate-700 flex items-center gap-1.5">
              <i data-lucide="mouse-pointer-click" class="w-3.5 h-3.5 text-blue-600"></i><span id="anno-section-title">交互标注</span>
            </span>
            <button id="toggle-show-all-btn" class="flex items-center gap-1 text-[11px] text-slate-500 hover:text-blue-600 font-medium px-2 py-0.5 rounded hover:bg-slate-100 transition-colors" title="显示/隐藏全部标注高亮">
              <i data-lucide="highlighter" class="w-3 h-3"></i><span>全部高亮</span>
            </button>
          </div>
          <div class="space-y-3" id="annotation-list">
            <div class="text-center text-slate-400 text-sm mt-8" id="annotation-empty-hint">
              <i data-lucide="mouse-pointer-click" class="w-8 h-8 mx-auto mb-2 opacity-50"></i>
              点击原型中的标注徽章，或点「全部高亮」总览
            </div>
          </div>
        </div>
      </div>
    </aside>
  </div>

  <!-- 全局说明抽屉（只读） -->
  <div id="global-req-drawer" class="fixed inset-y-0 right-0 w-[600px] bg-white shadow-2xl border-l border-slate-200 transform translate-x-full transition-transform duration-300 ease-in-out z-50 flex flex-col">
    <div class="h-14 border-b border-slate-200 flex items-center justify-between px-6 bg-slate-50">
      <h2 class="font-semibold text-slate-800">全局需求说明 (PRD)</h2>
      <button id="close-req-drawer" class="text-slate-400 hover:text-slate-700 transition-colors p-1"><i data-lucide="x" class="w-5 h-5"></i></button>
    </div>
    <div class="flex-1 overflow-hidden relative">
      <div id="global-req-preview" class="w-full h-full p-6 bg-white max-w-none overflow-y-auto"></div>
    </div>
  </div>
  <div id="drawer-overlay" class="fixed inset-0 bg-slate-900/20 backdrop-blur-sm z-40 hidden opacity-0 transition-opacity duration-300"></div>

  <script src="./workspace/data/project-data.js"></script>
  <script src="./framework/shell/viewer.js"></script>
  <script>lucide.createIcons();</script>
</body>
</html>
