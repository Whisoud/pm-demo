<!-- PM-Framework 版本存档 v1.0.2 · 由工作台生成，勿手改 -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>测试</title>
  <style>
    :root{
      --bg:#0b1220; --card:#131f38; --line:#233150; --fg:#eef2f7; --muted:#93a1b5;
      --accent:#34d399; --accent-dim:rgba(52,211,153,.14); --blue:#60a5fa; --amber:#fbbf24; --red:#f87171;
    }
    *{box-sizing:border-box}
    body{margin:0;padding:32px 24px;background:var(--bg);color:var(--fg);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
      font-size:16px;line-height:1.75}
    .wrap{max-width:760px;margin:0 auto}
    h1{font-size:24px;margin:0 0 8px}
    .sub{color:var(--muted);font-size:14px;margin:0 0 28px}
    .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px 24px;margin-bottom:16px}
    .card h2{font-size:16px;margin:0 0 12px}
    .row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
    button{appearance:none;border:1px solid var(--line);background:transparent;color:var(--fg);
      font:inherit;font-size:14px;padding:8px 16px;border-radius:8px;cursor:pointer;transition:.15s}
    button:hover{border-color:var(--accent);color:var(--accent)}
    button.primary{background:var(--accent-dim);border-color:var(--accent);color:var(--accent);font-weight:600}
    button.danger:hover{border-color:var(--red);color:var(--red)}
    .counter{font-size:28px;font-weight:700;min-width:64px;text-align:center;color:var(--accent)}
    .toggle{display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none}
    .track{width:44px;height:24px;border-radius:12px;background:var(--line);position:relative;transition:.2s}
    .track::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;
      background:var(--muted);transition:.2s}
    .toggle.on .track{background:var(--accent-dim);border:1px solid var(--accent)}
    .toggle.on .track::after{left:21px;background:var(--accent)}
    .state{font-size:13px;color:var(--muted)}
    .state b{color:var(--fg)}
    .log{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;color:var(--muted);
      background:#0a1020;border:1px solid var(--line);border-radius:8px;padding:12px 14px;max-height:160px;overflow:auto}
    .log div{padding:2px 0;border-bottom:1px dashed #1a2740}
    .log div:last-child{border-bottom:none}
    .log .t{color:var(--blue)}
  </style>
</head>
<body>
  <div class="wrap">
    <h1>测试页面</h1>
    <p class="sub">用于验证交互原型的自包含演示：按钮、开关、计数与事件日志。</p>

    <div class="card">
      <h2>弹窗与提示</h2>
      <div class="row">
        <button class="primary" id="btn-toast" data-prd-id="prd-muodmuhs-hnd1q">轻提示 Toast</button>
        <button class="danger" id="btn-confirm" data-prd-id="prd-muobzs46-jcc2f">二次确认 Confirm</button>
        <button id="btn-copy" data-prd-id="prd-muocp0xs-zwu0s">复制文本</button>
      </div>
    </div>

    <div class="card">
      <h2>开关与计数</h2>
      <div class="row">
        <div class="toggle" id="toggle" role="switch" aria-checked="false" tabindex="0">
          <div class="track"></div>
          <span class="state">状态：<b id="toggle-state">关闭</b></span>
        </div>
        <button id="btn-minus">−</button>
        <span class="counter" id="counter">0</span>
        <button id="btn-plus">＋</button>
      </div>
    </div>

    <div class="card">
      <h2>事件日志</h2>
      <div class="log" id="log"><div>等待操作…</div></div>
    </div>
  </div>

  <script src="../../framework/assets/scripts/page-bridge.js"></script>
  <script>
    (function () {
      var log = document.getElementById('log');
      function appendLog(msg) {
        var t = new Date().toLocaleTimeString('zh-CN', { hour12: false });
        var item = document.createElement('div');
        item.innerHTML = '<span class="t">[' + t + ']</span> ' + msg;
        if (log.firstChild && log.firstChild.textContent === '等待操作…') log.innerHTML = '';
        log.prepend(item);
      }

      document.getElementById('btn-toast').addEventListener('click', function () {
        window.parent && window.parent.showToast && window.parent.showToast('保存成功', 'success');
        appendLog('触发轻提示 Toast');
      });

      document.getElementById('btn-confirm').addEventListener('click', function () {
        window.parent && window.parent.showConfirm && window.parent.showConfirm(
          '确认删除', '确定要删除这条测试记录吗？',
          function () { appendLog('确认弹窗 → 点击了「确定」'); },
          '确定', 'danger'
        );
        appendLog('弹出二次确认');
      });

      document.getElementById('btn-copy').addEventListener('click', function () {
        window.parent && window.parent.copyText && window.parent.copyText('PM-Framework 测试页面 ' + Date.now());
        appendLog('文本已复制到剪贴板');
      });

      var toggle = document.getElementById('toggle');
      var toggleState = document.getElementById('toggle-state');
      function flip() {
        var on = toggle.classList.toggle('on');
        toggle.setAttribute('aria-checked', on ? 'true' : 'false');
        toggleState.textContent = on ? '开启' : '关闭';
        appendLog('开关切换为 ' + (on ? '开启' : '关闭'));
      }
      toggle.addEventListener('click', flip);
      toggle.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); flip(); }
      });

      var n = 0, counter = document.getElementById('counter');
      document.getElementById('btn-plus').addEventListener('click', function () {
        counter.textContent = ++n; appendLog('计数 +1 → ' + n);
      });
      document.getElementById('btn-minus').addEventListener('click', function () {
        counter.textContent = --n; appendLog('计数 -1 → ' + n);
      });
    })();
  </script>
</body>
</html>
